name: "1996"

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

targets:
  1996:
    type: application
    platform: iOS

    sources:
      - path: .
        includes:
          - "*.swift"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.app1996
        PRODUCT_NAME: "1996"
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  1996:
    build:
      targets:
        1996: all
    archive:
      config: Release